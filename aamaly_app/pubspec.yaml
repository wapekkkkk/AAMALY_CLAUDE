name: aamaly
description: A Smart Task Management System for Academic Use
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # Date & Time
  intl: ^0.18.1
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Firebase Core (REQUIRED FIRST) - UPDATED VERSIONS
  firebase_core: ^3.8.1
  
  # Firebase Services - UPDATED VERSIONS
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.8
  firebase_messaging: ^15.1.8
  
  # File Operations
  file_picker: ^8.0.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/