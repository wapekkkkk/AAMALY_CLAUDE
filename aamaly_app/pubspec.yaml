name: aamaly
description: A Smart Task Management System for Academic Use
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  

  # State Management
  provider: ^6.1.1
  
  # Date & Time
  intl: ^0.18.1
  
  # ✅ ADD THESE FOR QR FEATURES:
  qr_flutter: ^4.1.0           # QR Code Generator
  mobile_scanner: ^5.2.3       # QR Code Scanner (latest version)
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Firebase Core (REQUIRED FIRST) - UPDATED VERSIONS
  firebase_core: ^3.8.1
  
  # Firebase Services - UPDATED VERSIONS
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.1.8
  
  # File Operations
  file_picker: ^10.3.8
  path_provider: ^2.1.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
